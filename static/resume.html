<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guido Luz Percú - Resume</title>

    <style>
        :root {
            --primary: #1f5f8b;       /* accent: links, company, highlights */
            --secondary: #174a6d;     /* accent hover */
            --on-primary: #ffffff;    /* text on accent backgrounds */
            --primary-soft: #e8f0f6;  /* tinted accent background */
            --dark: #111827;          /* headings */
            --light: #f1f3f5;         /* tags and tiles */
            --gray: #5b6472;          /* secondary text */
            --success: #2f7d4f;
            --border: #e3e6ea;
            --background: #f6f7f9;
            --card-bg: #ffffff;
            --text: #1f2933;
            --shadow: 0 1px 3px rgba(17, 24, 39, 0.06);
            --notice-bg: #fff8e1;
            --notice-text: #6b4e00;
            --notice-border: #e9c46a;
        }
        
        [data-theme="dark"] {
            --primary: #7cb7e0;
            --secondary: #a3cdea;
            --on-primary: #0f1419;
            --primary-soft: #1c2b38;
            --dark: #f3f5f7;
            --light: #222a33;
            --gray: #9aa4b1;
            --success: #6cc08b;
            --border: #2a323c;
            --background: #0f1419;
            --card-bg: #171d24;
            --text: #d6dbe1;
            --shadow: none;
            --notice-bg: #2b2410;
            --notice-text: #e8cf8a;
            --notice-border: #8a6d1f;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: var(--background);
            color: var(--text);
            line-height: 1.6;
            transition: all 0.3s ease;
        }
        
        .theme-switch {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 999;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }
        
        .theme-switch:hover {
            transform: scale(1.1);
        }
        
        .theme-switch i {
            font-size: 1.2rem;
            color: var(--primary);
        }
        
        .options-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 10px 15px;
            background-color: var(--card-bg);
            border-radius: 8px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .resume-filters {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .version-selector {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        
        .version-selector option {
            background-color: var(--card-bg);
            color: var(--text);
        }
        
        .filter-label {
            font-size: 0.9rem;
            color: var(--gray);
        }
        
        .download-options {
            display: flex;
            gap: 10px;
        }
        
        .download-btn {
            background-color: var(--primary);
            color: var(--on-primary);
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
        
        .download-btn:hover {
            background-color: var(--secondary);
            transform: translateY(-2px);
        }
        
        .last-updated {
            color: var(--gray);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .error {
            text-align: center;
            padding: 30px;
            background-color: var(--card-bg);
            border-radius: 10px;
            border-left: 4px solid #dc3545;
            margin-bottom: 20px;
        }
        
        .loading-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            color: var(--text);
        }
        
        .container {
            max-width: 1140px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 10px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 30px;
            transition: background-color 0.3s ease;
        }
        
        .resume-badge {
            background-color: var(--primary);
            color: var(--on-primary);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 15px;
            display: inline-block;
        }
        
        .profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        
        .name {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--dark);
        }
        
        .title {
            font-size: 1.5rem;
            color: var(--gray);
            margin-bottom: 20px;
        }
        
        .contact-info {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .contact-item i {
            color: var(--primary);
        }
        
        .contact-item a {
            color: var(--primary);
            text-decoration: none;
        }
        
        .contact-item a:hover {
            text-decoration: underline;
        }
        
        .social-links {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }
        
        .social-link {
            color: var(--primary);
            font-size: 1.5rem;
            transition: transform 0.3s;
        }
        
        .social-link:hover {
            transform: translateY(-3px);
        }
        
        .section {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 10px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 30px;
            transition: background-color 0.3s ease;
        }
        
        .section-title {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: var(--dark);
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }
        
        .about-me p {
            font-size: 1.1rem;
            margin-bottom: 15px;
        }
        
        .skills-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        
        .skill-category {
            margin-bottom: 15px;
        }
        
        .skill-category h4 {
            color: var(--dark);
            margin-bottom: 10px;
            font-size: 1.2rem;
        }
        
        .skill-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .skill-tag {
            background-color: var(--light);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        
        .skill-highlight {
            background-color: var(--primary);
            color: var(--on-primary);
            font-weight: bold;
        }
        
        .experience-item {
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--border);
        }
        
        .experience-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        
        .job-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .job-title {
            font-size: 1.3rem;
            color: var(--dark);
        }
        
        .company {
            font-weight: bold;
            color: var(--primary);
        }
        
        .period {
            color: var(--gray);
        }
        
        .job-location {
            color: var(--gray);
            font-style: italic;
            margin-bottom: 10px;
        }
        
        .job-description {
            margin-top: 10px;
        }
        
        ul.highlights {
            padding-left: 20px;
            margin-bottom: 15px;
        }
        
        ul.highlights li {
            margin-bottom: 5px;
        }
        
        .tech-stack {
            margin-top: 10px;
        }
        
        .tech-stack-title {
            font-weight: bold;
            color: var(--dark);
            margin-bottom: 5px;
        }
        
        .tech-stack-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .tech-item {
            background-color: var(--light);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        
        .tech-highlight {
            background-color: var(--primary);
            color: var(--on-primary);
            font-weight: bold;
        }
        
        .project-item {
            margin-bottom: 25px;
        }
        
        .project-name {
            font-size: 1.2rem;
            color: var(--dark);
            margin-bottom: 5px;
        }
        
        .job-summary,
        .project-description {
            margin-bottom: 10px;
        }
        
        .education-item {
            margin-bottom: 25px;
        }
        
        .education-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        
        .institution {
            font-size: 1.2rem;
            color: var(--dark);
        }
        
        .degree {
            color: var(--gray);
        }
        
        .certifications-list {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        
        .certification-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
            text-align: center;
            width: 220px;
        }
        
        .certification-badge {
            width: 150px;
            height: 150px;
            margin-bottom: 10px;
            transition: transform 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-radius: 50%;
        }
        
        .certification-badge:hover {
            transform: scale(1.05);
        }
        
        .certification-item .certification-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: bold;
            margin-top: 8px;
        }
        
        .certification-item .certification-link:hover {
            text-decoration: underline;
        }
        
        .publications-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        
        .publication-item {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            transition: transform 0.3s;
        }
        
        .publication-item:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow);
        }
        
        .publication-name {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: var(--dark);
        }
        
        .publication-details {
            color: var(--gray);
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        
        .publication-link {
            display: inline-block;
            color: var(--primary);
            text-decoration: none;
            margin-top: 10px;
        }
        
        .publication-link:hover {
            text-decoration: underline;
        }
        
        .additional-info {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .info-item {
            background-color: var(--light);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .info-title {
            font-weight: bold;
            color: var(--dark);
            margin-bottom: 5px;
        }
        
        .info-value {
            color: var(--primary);
            font-size: 1.1rem;
        }
        
        .availability {
            background-color: var(--primary-soft);
            color: var(--primary);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .preferred-locations {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .location-tag {
            background-color: var(--light);
            color: var(--dark);
            padding: 5px 15px;
            border-radius: 20px;
        }
        
        .cors-notice {
            background-color: var(--notice-bg);
            color: var(--notice-text);
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            border-left: 4px solid var(--notice-border);
        }
        
        .cors-notice a {
            color: inherit;
            text-decoration: underline;
        }
        
        footer {
            text-align: center;
            padding: 20px 0;
            color: var(--gray);
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .job-header, .education-header {
                flex-direction: column;
                gap: 5px;
            }
            
            .skills-container {
                grid-template-columns: 1fr;
            }
            
            .publications-list {
                grid-template-columns: 1fr;
            }
        }
        
        /* Print styles */
        @media print {
            body {
                background-color: white;
                color: black;
                font-size: 10pt;
                line-height: 1.4;
            }
            
            .container {
                width: 100%;
                max-width: none;
                padding: 0;
                margin: 0;
            }
            
            header, .section {
                box-shadow: none;
                border: none;
                padding: 15px 0;
                margin-bottom: 10px;
            }
            
            /* Hide specified sections for print */
            .publications, .projects, .skills, .additional-info-section, .availability-section, footer {
                display: none !important;
            }
            
            /* Keep certifications visible in print version */
            .education {
                page-break-inside: avoid;
                display: block !important;
            }
            
            .education .institution, .education .period, .education .degree {
                display: none;
            }
            
            /* Format certification badges for print */
            .certifications-list {
                justify-content: flex-start;
                gap: 10px;
            }
            
            .certification-item {
                width: auto;
                flex-direction: row;
                align-items: center;
                margin-right: 20px;
            }
            
            .certification-badge {
                width: 60px;
                height: 60px;
                margin-bottom: 0;
                margin-right: 10px;
            }
            
            /* Hide UI elements */
            .theme-switch {
                display: none;
            }
            
            .options-bar {
                display: none;
            }
            
            .cors-notice {
                display: none;
            }
            
            /* Make the header more compact */
            .profile {
                text-align: left;
                align-items: flex-start;
            }
            
            .name {
                font-size: 20pt;
                margin-bottom: 5px;
            }
            
            .title {
                font-size: 14pt;
                margin-bottom: 10px;
            }
            
            .contact-info {
                justify-content: flex-start;
                gap: 15px;
                margin-bottom: 10px;
                font-size: 9pt;
            }
            
            /* Optimize work experience section */
            .section-title {
                font-size: 14pt;
                margin-bottom: 10px;
                padding-bottom: 5px;
            }
            
            .experience-item {
                padding-bottom: 10px;
                margin-bottom: 10px;
            }
            
            .job-title {
                font-size: 11pt;
            }
            
            .job-header {
                margin-bottom: 5px;
            }
            
            .job-location {
                margin-bottom: 5px;
            }
            
            ul.highlights {
                margin-bottom: 8px;
            }
            
            ul.highlights li {
                margin-bottom: 2px;
            }
            
            /* Make tech stack more compact */
            .tech-stack-list {
                display: inline;
                font-size: 8pt;
            }
            
            .tech-item {
                display: inline-block;
                margin-right: 5px;
                margin-bottom: 3px;
                padding: 1px 4px;
            }
            
            /* Remove hyperlink display for cleaner print */
            a {
                text-decoration: none;
                color: black;
            }
            
            a::after {
                content: "";
                display: none;
            }
            
            .social-links {
                display: none;
            }
            
            /* Add page breaks to avoid cutting experience items */
            .experience-item {
                page-break-inside: avoid;
            }
            
            /* Ensure proper spacing between items */
            .section + .section {
                margin-top: 10px;
            }
            
            /* About Me section more compact */
            .about-me p {
                font-size: 10pt;
                margin-bottom: 10px;
            }
            
            .resume-badge {
                font-size: 8pt;
                padding: 2px 8px;
                margin-bottom: 5px;
            }
        }
    </style>
</head>

            // Function to fetch and load JSON resume data
            function loadResumeData() {
                // Set a timeout to load fallback data if fetch fails
                const timeoutId = setTimeout(() => {
                    console.log('Fetch timeout - loading fallback data');
                    loadFallbackData();
                }, 3000); // 3 second timeout
                
                // Fetch the resume data from the provided URL
                try {
                    fetch('https://www.guidopercu.dev/resume.json', { cache: 'no-cache' })
                        .then(response => {
                            clearTimeout(timeoutId); // Clear the timeout since fetch succeeded
                            if (!response.ok) {
                                throw new Error('Network response was not ok');
                            }
                            return response.json();
                        })
                        .then(data => {
                            resumeRawData = data; // Store the raw data
                            const version = localStorage.getItem('resumeVersion') || 'complete';
                            filterAndRenderResume(data, version);
                        })
                        .catch(error => {
                            clearTimeout(timeoutId); // Clear the timeout since we're handling the error
                            console.error('Error loading resume data:', error);
                            loadFallbackData();
                        });
                } catch (error) {
                    clearTimeout(timeoutId);
                    console.error('Fetch failed completely:', error);
                    loadFallbackData();
                }
            }

            function filterSkillKeywords(data, category, predicate) {

            // Helper functions for scoring job relevance
            function getPythonScore(techStackStr) {
                let score = 0;
                if (techStackStr.includes('python')) score += 10;
                if (techStackStr.includes('django')) score += 5;
                if (techStackStr.includes('flask')) score += 5;
                if (techStackStr.includes('fastapi')) score += 5;
                if (techStackStr.includes('aws')) score += 3;
                return score;

            function getPHPScore(techStackStr) {
                let score = 0;
                if (techStackStr.includes('php')) score += 10;
                if (techStackStr.includes('laravel')) score += 8;
                if (techStackStr.includes('yii')) score += 5;
                return score;

                    `).join('')}
                `;
                container.appendChild(experienceSection);
                
                // Projects section
                const projectsSection = document.createElement('section');
                projectsSection.className = 'section projects';
                projectsSection.innerHTML = `
                    <h3 class="section-title">Projects</h3>
                    ${data.projects.map(project => `
                        <div class="project-item">
                            <h4 class="project-name">${project.name}</h4>
                            <div class="period">${project.startDate} - ${project.endDate || "Present"}</div>
                            <p class="project-description">${project.description}</p>
                            <ul class="highlights">
                                ${project.highlights.map(highlight => `<li>${highlight}</li>`).join('')}
                            </ul>
                            <div class="tech-stack">
                                <div class="tech-stack-title">Tech Stack:</div>
                                <div class="tech-stack-list">
                                    ${project.techStack.map(tech => {
                                        let classes = "tech-item";
                                        // Add highlight class for relevant technologies based on version
                                        if (version === 'python' && isPythonTech(tech)) {
                                            classes += " tech-highlight";
                                        } else if (version === 'php' && isPHPTech(tech)) {
                                            classes += " tech-highlight";
                                        }
                                        return `<span class="${classes}">${tech}</span>`;
                                    }).join('')}
                                </div>
                            </div>
                        </div>
                    `).join('')}
                `;
                container.appendChild(projectsSection);
                
                // Skills section
                const skillsSection = document.createElement('section');
                skillsSection.className = 'section skills';
                skillsSection.innerHTML = `
                    <h3 class="section-title">Skills</h3>
                    <div class="skills-container">
                        ${data.meta.coreCompetencies.map(skill => `
                            <div class="skill-item">
                                <h4>${skill.name}</h4>
                                <p>${skill.description}</p>
                            </div>
                        `).join('')}
                    </div>
                    
                    <h3 class="section-title" style="margin-top: 30px;">Technical Skills</h3>
                    <div class="skills-container">
                        ${data.skills.map(({ name: category, keywords: skills }) => `
                            <div class="skill-category">
                                <h4>${capitalize(category)}</h4>
                                <div class="skill-list">
                                    ${skills.map(skill => {
                                        let classes = "skill-tag";
                                        // Add highlight class for relevant skills based on version
                                        if (version === 'python' && isPythonTech(skill)) {
                                            classes += " skill-highlight";
                                        } else if (version === 'php' && isPHPTech(skill)) {
                                            classes += " skill-highlight";
                                        }
                                        return `<span class="${classes}">${skill}</span>`;
                                    }).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(skillsSection);
                
                // Education section
                const educationSection = document.createElement('section');
                educationSection.className = 'section education';
                
                // Always show certifications regardless of resume version
                educationSection.innerHTML = `
                    <h3 class="section-title">Certifications</h3>
                    <ul class="certifications-list">
                        ${data.certificates.map(cert => `
                            <li class="certification-item">
                                <img src="${cert.badgeUrl}" alt="${cert.name}" class="certification-badge">
                                ${cert.url ? `<a href="${cert.url}" target="_blank" class="certification-link">${cert.name}</a>` : `<span class="certification-link">${cert.name}</span>`}
                            </li>
                        `).join('')}
                    </ul>
                `;
                
                // Only show education details in the complete version
                if (version === 'complete') {
                    educationSection.innerHTML = `
                    <h3 class="section-title">Education</h3>
                    ${data.education.map(edu => `
                        <div class="education-item">
                            <div class="education-header">
                                <h4 class="institution">${edu.institution}</h4>
                                <span class="period">${edu.startDate} - ${edu.endDate}</span>
                            </div>
                            <div class="degree">${edu.studyType} in ${edu.area}</div>
                        </div>
                    `).join('')}
                    
                    <h3 class="section-title" style="margin-top: 30px;">Certifications</h3>
                    <ul class="certifications-list">
                        ${data.certificates.map(cert => `
                            <li class="certification-item">
                                <img src="${cert.badgeUrl}" alt="${cert.name}" class="certification-badge">
                                ${cert.url ? `<a href="${cert.url}" target="_blank" class="certification-link">${cert.name}</a>` : `<span class="certification-link">${cert.name}</span>`}
                            </li>
                        `).join('')}
                    </ul>
                    `;
                }
                
                container.appendChild(educationSection);
                
                // Publications section - conditionally include based on resume version
                if (version === 'complete' || version === 'php') { // Show publications for PHP or complete resume
                    const publicationsSection = document.createElement('section');
                    publicationsSection.className = 'section publications';
                    publicationsSection.innerHTML = `
                        <h3 class="section-title">Publications</h3>
                        <div class="publications-list">
                            ${data.publications.map(pub => `
                                <div class="publication-item">
                                    <h4 class="publication-name">${pub.name}</h4>
                                    <div class="publication-details">
                                        <div>${pub.publisher} | ${pub.releaseDate}</div>
                                        <div>${pub.type}</div>
                                    </div>
                                    <a href="${pub.url}" target="_blank" class="publication-link">Read Article <i class="fas fa-external-link-alt"></i></a>
                                </div>
                            `).join('')}
                        </div>
                    `;
                    container.appendChild(publicationsSection);
                }
                
                // Additional Info section
                const additionalInfoSection = document.createElement('section');
                additionalInfoSection.className = 'section additional-info-section';
                additionalInfoSection.innerHTML = `
                    <h3 class="section-title">Experience Summary</h3>
                    <div class="additional-info">
                        ${Object.entries(data.meta.additionalInfo).map(([key, value]) => {
                            // Filter info items based on version
                            if (version === 'python' && !['yearsOfExperience', 'yearsOfExperiencePython', 'yearsOfExperienceAWS'].includes(key)) {
                                return '';
                            }
                            if (version === 'php' && !['yearsOfExperience', 'yearsOfExperiencePHP', 'yearsOfExperienceNodeJS'].includes(key)) {
                                return '';
                            }
                            return `
                                <div class="info-item">
                                    <div class="info-title">${formatInfoKey(key)}</div>
                                    <div class="info-value">${value}</div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
                container.appendChild(additionalInfoSection);
                
                // Availability section
                if (data.availability) {
                const availabilitySection = document.createElement('section');
                availabilitySection.className = 'section availability-section';
                availabilitySection.innerHTML = `
                    <h3 class="section-title">Availability</h3>
                    <div class="availability">${data.availability.status}</div>
                    <div class="preferred-locations">
                        ${data.availability.preferredLocation.map(loc => `
                            <span class="location-tag"><i class="fas fa-map-marker-alt"></i> ${loc}</span>
                        `).join('')}
                    </div>
                `;
                container.appendChild(availabilitySection);
                }
                
                // Footer
                const footer = document.createElement('footer');
                if (data.meta && data.meta.lastModified) {
                    footer.innerHTML = `
                        <p>Last updated: ${formatMonthYear(data.meta.lastModified)}</p>
                    `;
                }
                container.appendChild(footer);
            }
            
            // Helper functions
            function formatDate(dateStr) {
                if (!dateStr) return '';
                
                const [year, month] = dateStr.split('-');
                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                
                return month ? `${months[parseInt(month) - 1]} ${year}` : year;
            }
            
            function capitalize(str) {
                return str.charAt(0).toUpperCase() + str.slice(1);
            }
            
            function formatInfoKey(key) {
                if (key === 'yearsOfExperience') return 'Total Experience';
                
                const names = { NodeJS: 'Node.js', CSharp: 'C#' };
                const name = key.replace('yearsOfExperience', '');
                
                // Split camelCase words but keep acronyms like AWS and PHP intact
                return names[name] || name.replace(/([a-z])([A-Z])/g, '$1 $2') || 'Total Experience';
            }
            
            function formatMonthYear(dateStr) {
                const [year, month] = dateStr.split('-');
                return month
                    ? new Date(year, month - 1).toLocaleString('en-US', { month: 'long', year: 'numeric' })
                    : year;
            }
            
            // Theme toggle functionality
            function setupThemeToggle() {
                const themeToggle = document.getElementById('theme-toggle');
                if (!themeToggle) return; // Safety check
                
                const icon = themeToggle.querySelector('i');
                
                // Check for saved theme preference or use preferred color scheme
                const savedTheme = localStorage.getItem('theme');
                if (savedTheme) {
                    document.documentElement.setAttribute('data-theme', savedTheme);
                    if (savedTheme === 'dark') {
                        icon.classList.replace('fa-moon', 'fa-sun');
                    }
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    icon.classList.replace('fa-moon', 'fa-sun');
                    localStorage.setItem('theme', 'dark');
                }
                
                // Toggle theme on click
                themeToggle.addEventListener('click', function() {
                    const currentTheme = document.documentElement.getAttribute('data-theme');
                    let newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                    
                    document.documentElement.setAttribute('data-theme', newTheme);
                    localStorage.setItem('theme', newTheme);
                    
                    if (newTheme === 'dark') {
                        icon.classList.replace('fa-moon', 'fa-sun');
                    } else {
                        icon.classList.replace('fa-sun', 'fa-moon');
                    }
                });
            }
            
            // Load the resume data
            loadResumeData();
            
            // Setup theme toggle
            setupThemeToggle();
        });
    </script>
</body>
</html>
